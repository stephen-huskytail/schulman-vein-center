<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E6ECF4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6FB"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="540" rx="24" fill="url(#card)" stroke="#D6DFEA" stroke-width="2"/>

  <!-- Decision flowchart -->
  <!-- Top: question node -->
  <rect x="400" y="100" width="400" height="60" rx="30" fill="#0D4E73"/>
  <text x="600" y="137" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Which Treatment Is Right for You?</text>

  <!-- Arrow down -->
  <line x1="600" y1="160" x2="600" y2="200" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="594,196 606,196 600,206" fill="#94A3B8"/>

  <!-- Decision diamond -->
  <polygon points="600,210 720,270 600,330 480,270" fill="#F0F6FC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">Vein Size</text>
  <text x="600" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">&#x26; Symptoms?</text>

  <!-- Left branch: Large veins -> EVLT -->
  <line x1="480" y1="270" x2="320" y2="270" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="324,264 324,276 314,270" fill="#94A3B8"/>
  <text x="400" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Large, symptomatic</text>

  <rect x="120" y="240" width="200" height="60" rx="14" fill="#1E3A5F"/>
  <text x="220" y="267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">EVLT</text>
  <text x="220" y="287" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">Endovenous Laser</text>

  <!-- Right branch: Small veins -> Sclerotherapy -->
  <line x1="720" y1="270" x2="880" y2="270" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="876,264 876,276 886,270" fill="#94A3B8"/>
  <text x="792" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Small, cosmetic</text>

  <rect x="880" y="240" width="200" height="60" rx="14" fill="#2BA8A8"/>
  <text x="980" y="267" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sclerotherapy</text>
  <text x="980" y="287" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">Injection Treatment</text>

  <!-- EVLT details card -->
  <rect x="120" y="330" width="200" height="160" rx="12" fill="#F0F6FC" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="220" y1="300" x2="220" y2="330" stroke="#94A3B8" stroke-width="2"/>
  <rect x="140" y="348" width="160" height="8" rx="4" fill="#1E3A5F" fill-opacity="0.2"/>
  <text x="140" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; Varicose veins</text>
  <text x="140" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; 45&#x2013;60 min procedure</text>
  <text x="140" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; Often insurance covered</text>
  <text x="140" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; Ultrasound-guided</text>
  <text x="140" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#1E3A5F">Local anesthesia</text>

  <!-- Sclerotherapy details card -->
  <rect x="880" y="330" width="200" height="160" rx="12" fill="#F0FAF9" stroke="#B8E0DC" stroke-width="1.5"/>
  <line x1="980" y1="300" x2="980" y2="330" stroke="#94A3B8" stroke-width="2"/>
  <rect x="900" y="348" width="160" height="8" rx="4" fill="#2BA8A8" fill-opacity="0.2"/>
  <text x="900" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; Spider veins</text>
  <text x="900" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; 15&#x2013;30 min session</text>
  <text x="900" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; Usually self-pay</text>
  <text x="900" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">&#x2022; Minimal downtime</text>
  <text x="900" y="464" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#2BA8A8">No anesthesia needed</text>

  <!-- Center: combination note -->
  <rect x="420" y="380" width="360" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFEA" stroke-width="1.5"/>
  <line x1="600" y1="330" x2="600" y2="380" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0D4E73" text-anchor="middle">Many patients benefit from both</text>
  <text x="600" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82" text-anchor="middle">EVLT first for reflux, then sclerotherapy for surface veins</text>
  <text x="600" y="450" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2BA8A8" text-anchor="middle">A vein exam determines the best plan</text>

  <!-- Bottom titles -->
  <text x="180" y="568" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0D4E73">
    Choosing Between EVLT and Sclerotherapy
  </text>
  <text x="180" y="602" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5A6C82">
    Your Treatment Pathway &#x2014; Schulman Vein and Laser Center
  </text>
</svg>
