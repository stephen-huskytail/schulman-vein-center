<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E6ECF4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6FB"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5D5C8"/>
      <stop offset="1" stop-color="#E8BBA8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="540" rx="24" fill="url(#card)" stroke="#D6DFEA" stroke-width="2"/>

  <!-- Left: stylized leg with vein illustration -->
  <g transform="translate(200, 120)">
    <!-- Leg silhouette -->
    <path d="M60,0 C70,0 85,10 90,40 L95,120 C98,160 100,200 98,240 L96,300 C95,330 90,360 85,380 L75,380 C78,360 80,330 82,300 L84,240 C86,200 84,160 81,120 L76,40 C73,10 62,0 60,0 Z" fill="url(#legGrad)" stroke="#D4A08A" stroke-width="1.5"/>
    <!-- Varicose vein paths -->
    <path d="M78,60 C82,80 85,100 83,130 C81,160 84,180 82,210 C80,240 78,260 80,290" stroke="#6B3FA0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M75,80 C72,100 70,120 73,145" stroke="#8B5FBF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M83,180 C88,195 86,215 84,235" stroke="#8B5FBF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- Indicator circles -->
    <circle cx="83" cy="130" r="8" fill="none" stroke="#E84D3D" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="82" cy="210" r="8" fill="none" stroke="#E84D3D" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Right: symptom checklist -->
  <g transform="translate(460, 130)">
    <rect x="0" y="0" width="520" height="370" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="50" rx="16" fill="#0D4E73"/>
    <rect x="0" y="30" width="520" height="20" fill="#0D4E73"/>
    <text x="30" y="33" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Common Symptoms to Watch For</text>

    <!-- Symptom items -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="#2BA8A8" fill-opacity="0.15" stroke="#2BA8A8" stroke-width="1.5"/>
      <path d="M6,12 L10,16 L18,8" stroke="#2BA8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E3A5F">Leg heaviness and aching</text>
    </g>
    <g transform="translate(30, 115)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="#2BA8A8" fill-opacity="0.15" stroke="#2BA8A8" stroke-width="1.5"/>
      <path d="M6,12 L10,16 L18,8" stroke="#2BA8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E3A5F">Swelling near the ankles</text>
    </g>
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="#2BA8A8" fill-opacity="0.15" stroke="#2BA8A8" stroke-width="1.5"/>
      <path d="M6,12 L10,16 L18,8" stroke="#2BA8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E3A5F">Nighttime leg cramping</text>
    </g>
    <g transform="translate(30, 205)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="#2BA8A8" fill-opacity="0.15" stroke="#2BA8A8" stroke-width="1.5"/>
      <path d="M6,12 L10,16 L18,8" stroke="#2BA8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E3A5F">Itching around visible veins</text>
    </g>
    <g transform="translate(30, 250)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="#2BA8A8" fill-opacity="0.15" stroke="#2BA8A8" stroke-width="1.5"/>
      <path d="M6,12 L10,16 L18,8" stroke="#2BA8A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E3A5F">Skin changes near lower leg</text>
    </g>

    <!-- CTA -->
    <rect x="30" y="300" width="220" height="44" rx="10" fill="#2BA8A8"/>
    <text x="140" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Schedule an Evaluation</text>
  </g>

  <!-- Bottom titles -->
  <text x="180" y="568" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0D4E73">
    Understanding Varicose Veins: When to Seek Treatment
  </text>
  <text x="180" y="602" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5A6C82">
    Recognize the Warning Signs &#x2014; Schulman Vein and Laser Center
  </text>
</svg>
