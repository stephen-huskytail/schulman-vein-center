<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E6ECF4"/>
    </linearGradient>
    <linearGradient id="divider" x1="600" y1="100" x2="600" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBD5E1" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#CBD5E1"/>
      <stop offset="0.8" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#CBD5E1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="540" rx="24" fill="#FFFFFF" stroke="#D6DFEA" stroke-width="2"/>

  <!-- Divider -->
  <line x1="600" y1="100" x2="600" y2="510" stroke="url(#divider)" stroke-width="1.5"/>
  <circle cx="600" cy="305" r="28" fill="#F5F7FA" stroke="#D6DFEA" stroke-width="2"/>
  <text x="600" y="312" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F" text-anchor="middle">VS</text>

  <!-- LEFT: Spider Veins -->
  <rect x="120" y="100" width="420" height="410" rx="16" fill="#F0FAF9" stroke="#B8E0DC" stroke-width="1.5"/>
  <rect x="120" y="100" width="420" height="52" rx="16" fill="#2BA8A8"/>
  <rect x="120" y="132" width="420" height="20" fill="#2BA8A8"/>
  <text x="330" y="133" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Spider Veins</text>

  <!-- Spider vein illustration -->
  <g transform="translate(240, 180)">
    <circle cx="40" cy="30" r="3" fill="#C94040" opacity="0.6"/>
    <line x1="40" y1="30" x2="20" y2="15" stroke="#C94040" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="30" x2="60" y2="18" stroke="#C94040" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="30" x2="55" y2="48" stroke="#C94040" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="30" x2="25" y2="50" stroke="#C94040" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="30" x2="15" y2="35" stroke="#C94040" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="30" x2="62" y2="35" stroke="#C94040" stroke-width="1.2" opacity="0.6"/>
    <line x1="40" y1="30" x2="35" y2="8" stroke="#8B3FC9" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="30" x2="50" y2="55" stroke="#8B3FC9" stroke-width="1" opacity="0.5"/>

    <circle cx="130" cy="25" r="3" fill="#8B3FC9" opacity="0.5"/>
    <line x1="130" y1="25" x2="110" y2="12" stroke="#8B3FC9" stroke-width="1" opacity="0.5"/>
    <line x1="130" y1="25" x2="148" y2="15" stroke="#8B3FC9" stroke-width="1" opacity="0.5"/>
    <line x1="130" y1="25" x2="145" y2="40" stroke="#8B3FC9" stroke-width="1" opacity="0.5"/>
    <line x1="130" y1="25" x2="115" y2="42" stroke="#8B3FC9" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Spider vein details -->
  <g transform="translate(150, 260)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#2BA8A8" fill-opacity="0.1"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#2BA8A8">Size: Small, fine (&#x3C; 1mm)</text>
  </g>
  <g transform="translate(150, 300)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#2BA8A8" fill-opacity="0.1"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#2BA8A8">Depth: Superficial, near skin surface</text>
  </g>
  <g transform="translate(150, 340)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#2BA8A8" fill-opacity="0.1"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#2BA8A8">Symptoms: Usually cosmetic</text>
  </g>
  <g transform="translate(150, 380)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#2BA8A8" fill-opacity="0.1"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#2BA8A8">Treatment: Sclerotherapy</text>
  </g>
  <g transform="translate(150, 420)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#2BA8A8" fill-opacity="0.1"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#2BA8A8">Color: Red, blue, or purple web-like</text>
  </g>

  <!-- RIGHT: Varicose Veins -->
  <rect x="660" y="100" width="420" height="410" rx="16" fill="#F0F2F8" stroke="#C5CCE0" stroke-width="1.5"/>
  <rect x="660" y="100" width="420" height="52" rx="16" fill="#1E3A5F"/>
  <rect x="660" y="132" width="420" height="20" fill="#1E3A5F"/>
  <text x="870" y="133" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Varicose Veins</text>

  <!-- Varicose vein illustration -->
  <g transform="translate(780, 180)">
    <path d="M30,0 C35,15 25,30 30,45 C35,60 25,75 30,90" stroke="#6B3FA0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M30,30 C40,35 50,45 55,55" stroke="#6B3FA0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M30,60 C20,65 12,72 8,80" stroke="#6B3FA0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="30" cy="45" r="6" fill="#6B3FA0" opacity="0.3"/>
    <circle cx="30" cy="45" r="10" fill="none" stroke="#6B3FA0" stroke-width="1" opacity="0.2"/>

    <path d="M120,5 C125,20 115,35 120,50 C125,65 118,78 122,88" stroke="#4A2D80" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M120,25 C130,32 140,40 146,50" stroke="#4A2D80" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="120" cy="50" r="8" fill="#4A2D80" opacity="0.3"/>
  </g>

  <!-- Varicose vein details -->
  <g transform="translate(690, 260)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1E3A5F" fill-opacity="0.08"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Size: Large, bulging (&#x3E; 3mm)</text>
  </g>
  <g transform="translate(690, 300)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1E3A5F" fill-opacity="0.08"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Depth: Deeper valve dysfunction</text>
  </g>
  <g transform="translate(690, 340)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1E3A5F" fill-opacity="0.08"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Symptoms: Pain, swelling, fatigue</text>
  </g>
  <g transform="translate(690, 380)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1E3A5F" fill-opacity="0.08"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Treatment: EVLT or combination</text>
  </g>
  <g transform="translate(690, 420)">
    <rect x="0" y="0" width="360" height="30" rx="8" fill="#1E3A5F" fill-opacity="0.08"/>
    <text x="15" y="20" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Color: Blue-green, raised, rope-like</text>
  </g>

  <!-- Bottom titles -->
  <text x="180" y="568" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0D4E73">
    Spider Veins vs Varicose Veins: Key Differences
  </text>
  <text x="180" y="602" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5A6C82">
    Know the Difference &#x2014; Schulman Vein and Laser Center
  </text>
</svg>
