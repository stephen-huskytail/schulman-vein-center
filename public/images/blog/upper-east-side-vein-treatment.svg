<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E6ECF4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6FB"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0D4E73"/>
      <stop offset="1" stop-color="#2BA8A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Main card -->
  <rect x="80" y="70" width="1040" height="540" rx="24" fill="url(#card)" stroke="#D6DFEA" stroke-width="2"/>

  <!-- Accent bar top -->
  <rect x="80" y="70" width="1040" height="6" rx="3" fill="url(#accentBar)"/>

  <!-- Skyline silhouette (stylized Manhattan buildings) -->
  <g opacity="0.07">
    <rect x="100" y="200" width="40" height="340" fill="#0D4E73"/>
    <rect x="148" y="260" width="28" height="280" fill="#0D4E73"/>
    <rect x="184" y="230" width="52" height="310" fill="#0D4E73"/>
    <rect x="244" y="310" width="32" height="230" fill="#0D4E73"/>
    <rect x="284" y="280" width="44" height="260" fill="#0D4E73"/>
    <rect x="1000" y="220" width="40" height="320" fill="#0D4E73"/>
    <rect x="1048" y="270" width="30" height="270" fill="#0D4E73"/>
    <rect x="1086" y="240" width="50" height="300" fill="#0D4E73"/>
    <!-- Empire State style spire -->
    <rect x="576" y="100" width="12" height="60" fill="#0D4E73"/>
    <rect x="566" y="160" width="32" height="30" fill="#0D4E73"/>
    <rect x="552" y="190" width="60" height="40" fill="#0D4E73"/>
    <rect x="536" y="230" width="92" height="50" fill="#0D4E73"/>
    <rect x="516" y="280" width="132" height="60" fill="#0D4E73"/>
    <rect x="500" y="340" width="164" height="200" fill="#0D4E73"/>
  </g>

  <!-- Location pin -->
  <g transform="translate(180, 148)">
    <circle cx="0" cy="-8" r="18" fill="#2BA8A8"/>
    <circle cx="0" cy="-8" r="8" fill="#FFFFFF"/>
    <line x1="0" y1="10" x2="0" y2="24" stroke="#2BA8A8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="212" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#2BA8A8">Upper East Side, Manhattan</text>

  <!-- Clinic card -->
  <rect x="180" y="175" width="540" height="340" rx="16" fill="#FFFFFF" stroke="#D6DFEA" stroke-width="1.5"/>

  <!-- Clinic card header -->
  <rect x="180" y="175" width="540" height="52" rx="16" fill="#0D4E73"/>
  <rect x="180" y="207" width="540" height="20" fill="#0D4E73"/>
  <text x="205" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Schulman Vein and Laser Center</text>

  <!-- Clinic card body -->
  <rect x="205" y="244" width="240" height="14" rx="7" fill="#1E3A5F"/>
  <rect x="205" y="272" width="480" height="9" rx="4.5" fill="#D9E2EC"/>
  <rect x="205" y="293" width="420" height="9" rx="4.5" fill="#D9E2EC"/>
  <rect x="205" y="314" width="455" height="9" rx="4.5" fill="#D9E2EC"/>
  <rect x="205" y="335" width="390" height="9" rx="4.5" fill="#D9E2EC"/>

  <!-- Divider -->
  <line x1="205" y1="362" x2="695" y2="362" stroke="#E8EEF4" stroke-width="1"/>

  <!-- Service tags -->
  <rect x="205" y="374" width="110" height="28" rx="14" fill="#2BA8A8" fill-opacity="0.12"/>
  <text x="260" y="392" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#2BA8A8" text-anchor="middle">EVLT</text>
  <rect x="325" y="374" width="130" height="28" rx="14" fill="#2BA8A8" fill-opacity="0.12"/>
  <text x="390" y="392" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#2BA8A8" text-anchor="middle">Sclerotherapy</text>
  <rect x="465" y="374" width="120" height="28" rx="14" fill="#2BA8A8" fill-opacity="0.12"/>
  <text x="525" y="392" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#2BA8A8" text-anchor="middle">Free Screening</text>

  <!-- CTA button -->
  <rect x="205" y="416" width="200" height="46" rx="10" fill="#2BA8A8"/>
  <text x="305" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book a Consultation</text>

  <!-- Right side: stats panel -->
  <rect x="780" y="175" width="280" height="160" rx="14" fill="#F0F6FC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="805" y="210" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5A6C82" letter-spacing="1">MANHATTAN PATIENTS</text>
  <text x="805" y="250" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0D4E73">UES</text>
  <rect x="805" y="265" width="220" height="8" rx="4" fill="#9BB1CE"/>
  <rect x="805" y="285" width="180" height="8" rx="4" fill="#9BB1CE"/>
  <rect x="805" y="298" width="80" height="30" rx="8" fill="#1E3A5F"/>
  <text x="845" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">In-Office</text>

  <!-- Map/grid decoration -->
  <rect x="780" y="355" width="280" height="160" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Street grid lines (map-like) -->
  <line x1="800" y1="375" x2="800" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="840" y1="375" x2="840" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="880" y1="375" x2="880" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="920" y1="375" x2="920" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="960" y1="375" x2="960" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1000" y1="375" x2="1000" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1040" y1="375" x2="1040" y2="495" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="780" y1="400" x2="1060" y2="400" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="780" y1="430" x2="1060" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="780" y1="460" x2="1060" y2="460" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Map pin on grid -->
  <circle cx="900" cy="430" r="16" fill="#2BA8A8" fill-opacity="0.2"/>
  <circle cx="900" cy="422" r="10" fill="#2BA8A8"/>
  <circle cx="900" cy="422" r="4" fill="#FFFFFF"/>
  <line x1="900" y1="432" x2="900" y2="444" stroke="#2BA8A8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom titles -->
  <text x="180" y="570" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0D4E73">
    Vein Treatment on the Upper East Side
  </text>
  <text x="180" y="604" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5A6C82">
    What Manhattan Patients Should Know &#x2014; Schulman Vein and Laser Center
  </text>
</svg>
