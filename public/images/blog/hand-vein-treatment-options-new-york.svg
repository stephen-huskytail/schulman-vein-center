<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#E6ECF4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6FB"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5D5C8"/>
      <stop offset="1" stop-color="#E8BBA8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="80" y="70" width="1040" height="540" rx="24" fill="url(#card)" stroke="#D6DFEA" stroke-width="2"/>

  <!-- Left side: stylized hand illustration -->
  <g transform="translate(160, 130)">
    <!-- Hand outline -->
    <path d="M120,320 C100,300 80,260 70,220 L60,180 C55,160 50,140 55,120 L60,100 C62,90 68,82 75,80 L78,80 C85,80 90,88 88,96 L82,130 C80,140 82,150 86,158 L110,220 C115,232 120,240 130,248" fill="url(#handGrad)" stroke="#D4A08A" stroke-width="2"/>
    <!-- Fingers simplified -->
    <path d="M86,158 L90,120 C91,108 96,96 102,90 L105,88 C112,86 118,92 116,100 L108,140 L110,158" fill="url(#handGrad)" stroke="#D4A08A" stroke-width="1.5"/>
    <path d="M108,140 L114,95 C115,82 122,72 130,70 L133,70 C140,70 144,78 142,86 L132,138" fill="url(#handGrad)" stroke="#D4A08A" stroke-width="1.5"/>
    <path d="M132,138 L140,98 C142,85 148,76 156,74 L159,74 C166,74 170,82 168,90 L156,142" fill="url(#handGrad)" stroke="#D4A08A" stroke-width="1.5"/>
    <path d="M156,142 L160,112 C162,100 168,92 175,90 L178,90 C184,92 186,100 184,108 L174,152 L165,180" fill="url(#handGrad)" stroke="#D4A08A" stroke-width="1.5"/>

    <!-- Prominent veins on hand -->
    <path d="M90,280 C95,260 100,240 105,220 C110,200 108,180 110,160" stroke="#5A7FB0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M105,220 C115,210 125,200 130,185 C135,170 138,155 140,140" stroke="#5A7FB0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M100,240 C110,235 125,225 140,215 C155,205 160,190 162,175" stroke="#5A7FB0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M130,185 C135,178 140,172 148,165 C156,158 160,152 164,145" stroke="#5A7FB0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

    <!-- Treatment indicator -->
    <circle cx="120" cy="200" r="20" fill="none" stroke="#2BA8A8" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="120" cy="200" r="4" fill="#2BA8A8"/>
  </g>

  <!-- Right side: treatment info cards -->
  <g transform="translate(540, 115)">
    <!-- Evaluation card -->
    <rect x="0" y="0" width="480" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#0D4E73"/>
    <text x="42" y="48" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="80" y="38" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D4E73">Specialist Consultation</text>
    <text x="80" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Evaluate circulation, dominant veins, skin quality</text>
    <text x="80" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">and medical history before any recommendation</text>

    <!-- Treatment card -->
    <rect x="0" y="120" width="480" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="20" y="140" width="44" height="44" rx="10" fill="#1A5C7A"/>
    <text x="42" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="80" y="158" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D4E73">Individualized Treatment</text>
    <text x="80" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Targeted sclerotherapy or microphlebectomy</text>
    <text x="80" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Conservative, staged approach for safety</text>

    <!-- Recovery card -->
    <rect x="0" y="240" width="480" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="20" y="260" width="44" height="44" rx="10" fill="#2BA8A8"/>
    <text x="42" y="288" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="80" y="278" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0D4E73">Quick Recovery</text>
    <text x="80" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Resume routine hand use quickly</text>
    <text x="80" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6C82">Temporary bruising, personalized aftercare plan</text>

    <!-- Key point -->
    <rect x="0" y="365" width="480" height="52" rx="12" fill="#F0F6FC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="240" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0D4E73" text-anchor="middle">Goal: Improve appearance without compromising hand function</text>
  </g>

  <!-- Bottom titles -->
  <text x="180" y="568" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0D4E73">
    Hand Vein Treatment: What Patients Should Know
  </text>
  <text x="180" y="602" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5A6C82">
    Cosmetic Hand Vein Options &#x2014; Schulman Vein and Laser Center
  </text>
</svg>
