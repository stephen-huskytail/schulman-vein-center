  <text x="80" y="82" fill="#FFFFFF" font-family="Georgia, serif" font-size="50" font-weight="700">Vein Disorders &amp; Conditions</text>
  <text x="80" y="122" fill="#D7F3EF" font-family="Arial, sans-serif" font-size="26">Comprehensive mapping from symptom to targeted treatment</text>
</svg>
