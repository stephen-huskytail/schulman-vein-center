  <path d="M760 315 C790 250,840 345,875 280" fill="none" stroke="#D95D74" stroke-width="12" stroke-linecap="round"/>
  <text x="80" y="82" fill="#FFFFFF" font-family="Georgia, serif" font-size="50" font-weight="700">Free Vein Screening</text>
